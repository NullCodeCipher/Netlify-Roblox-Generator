<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox Alt Generator</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  #app {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #f9a8d4, #d8b4fe, #818cf8);
    background-size: 400% 400%;
    animation: gradientShift 30s ease infinite alternate-reverse;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 1rem;
  }
  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .card {
    background: #fff;
    border-radius: 1rem;
    padding: 2rem;
    width: 100%;
    max-width: 720px;
    box-shadow: 0 15px 30px rgba(0,0,0,.12);
  }
  .title {
    display: flex; align-items: center; justify-content: center; gap: .5rem;
    font-size: 1.5rem; font-weight: 700; color: #4b5563; margin: 0 0 .25rem;
  }
  .title-icon { color: #6366f1; font-size: 1.4rem; }
  .subtitle { text-align: center; color: #6b7280; font-size: .875rem; margin: 0 0 1.25rem; }

  .settings-toggle {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: .4rem;
    padding: .5rem; background: #f3f4f6; border: 0; border-radius: .5rem;
    font: inherit; font-size: .85rem; font-weight: 600; color: #4b5563;
    cursor: pointer; margin-bottom: .75rem; transition: background .15s;
  }
  .settings-toggle:hover { background: #e5e7eb; }
  .chevron { display: inline-block; transition: transform .2s; font-size: .7rem; }
  .chevron.rotated { transform: rotate(180deg); }

  .settings-panel {
    background: #f9fafb; border: 1px solid #e5e7eb;
    border-radius: .5rem; padding: 1rem; margin-bottom: .75rem;
  }
  .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
  .setting-item { display: flex; flex-direction: column; gap: .25rem; }
  .setting-item label {
    font-size: .75rem; font-weight: 600; color: #6b7280;
    text-transform: uppercase; letter-spacing: .05em;
  }
  .setting-item.toggle { flex-direction: row; align-items: center; justify-content: flex-end; }
  .setting-item.toggle label {
    display: flex; align-items: center; gap: .4rem;
    text-transform: none; font-size: .85rem; cursor: pointer;
  }
  .toggle-input { width: 1rem; height: 1rem; accent-color: #6366f1; cursor: pointer; }
  .select {
    width: 100%; padding: .5rem; border-radius: .4rem; border: 1px solid #d1d5db;
    font: inherit; font-size: .9rem; background: #fff; cursor: pointer;
  }
  .select:focus { outline: 0; border-color: #818cf8; box-shadow: 0 0 0 3px rgba(129,140,248,.2); }

  .generate-btn {
    width: 100%; padding: .75rem; background: #6366f1; color: #fff;
    border: 0; border-radius: .5rem; font: inherit; font-size: 1rem;
    font-weight: 600; cursor: pointer; display: flex; align-items: center;
    justify-content: center; gap: .5rem; transition: background .2s;
  }
  .generate-btn:hover:not(:disabled) { background: #4f46e5; }
  .generate-btn:disabled { opacity: .7; cursor: not-allowed; }

  .results-wrapper { margin-top: 1.5rem; display: flex; flex-direction: column; gap: .5rem; }
  .results-actions { display: flex; gap: .5rem; flex-wrap: wrap; }
  .action-btn {
    display: inline-flex; align-items: center; gap: .35rem;
    padding: .4rem .7rem; background: #f3f4f6; border: 1px solid #e5e7eb;
    border-radius: .4rem; font: inherit; font-size: .8rem; font-weight: 600;
    color: #4b5563; cursor: pointer; transition: all .15s;
  }
  .action-btn:hover { background: #e5e7eb; }
  .action-btn.danger { color: #b91c1c; }
  .action-btn.danger:hover { background: #fee2e2; }

  .results { border: 1px solid #e5e7eb; border-radius: .75rem; overflow: hidden; }
  .results-header, .result-row {
    display: grid; grid-template-columns: 2rem 1.2fr 1.4fr 5rem 2.5rem;
    gap: .4rem; align-items: center; padding: .5rem .75rem;
  }
  .results-header {
    background: #f3f4f6; font-size: .7rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: .05em; color: #6b7280;
  }
  .result-row { border-top: 1px solid #e5e7eb; font-size: .8rem; }
  .result-row:nth-child(even) { background: #fafafa; }
  .index { text-align: center; color: #9ca3af; font-size: .75rem; }
  .credential-input {
    width: 100%; padding: .35rem .45rem; border: 1px solid #d1d5db;
    border-radius: .35rem; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    font-size: .78rem; color: #374151; background: #fff;
  }
  .credential-input:focus { outline: 0; border-color: #818cf8; box-shadow: 0 0 0 2px rgba(129,140,248,.2); }
  .credential-input.mono { letter-spacing: -.02em; }

  .strength-badge {
    font-size: .65rem; font-weight: 700; text-align: center;
    padding: .2rem .35rem; border-radius: .3rem;
    text-transform: uppercase; letter-spacing: .03em;
  }
  .strength-badge.excellent { background: #dcfce7; color: #166534; }
  .strength-badge.strong    { background: #d1fae5; color: #065f46; }
  .strength-badge.good      { background: #dbeafe; color: #1e40af; }
  .strength-badge.fair      { background: #fef3c7; color: #92400e; }
  .strength-badge.weak      { background: #fee2e2; color: #991b1b; }

  .copy-btn {
    background: none; border: 0; cursor: pointer; color: #6b7280;
    padding: .25rem; border-radius: .25rem; font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
  }
  .copy-btn:hover { background: #e5e7eb; color: #374151; }

  .alert {
    margin-top: 1rem; padding: 1rem; border-radius: .5rem;
    display: flex; align-items: flex-start; gap: .5rem; font-size: .875rem;
  }
  .success { background: #d1fae5; color: #065f46; }
  .error   { background: #fee2e2; color: #991b1b; }
  .close-btn {
    background: none; border: 0; cursor: pointer;
    color: currentColor; margin-left: auto; font-size: 1rem; padding: 0;
  }

  .footer {
    margin-top: 2rem; text-align: center; font-size: .8rem; color: #6b7280;
    display: flex; flex-direction: column; align-items: center; gap: .5rem;
  }
  .security-note {
    display: inline-flex; align-items: center; gap: .35rem;
    background: #f0fdf4; color: #15803d;
    padding: .35rem .7rem; border-radius: .4rem; font-weight: 500;
  }
  .signup-link {
    display: inline-flex; align-items: center; gap: .25rem;
    color: #6366f1; text-decoration: none; font-weight: 500;
  }
  .signup-link:hover { text-decoration: underline; }

  .spinner {
    display: inline-block; width: 1rem; height: 1rem;
    border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
    border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .fade-enter-active, .fade-leave-active { transition: opacity .2s ease, transform .2s ease; }
  .fade-enter-from, .fade-leave-to { opacity: 0; transform: translateY(-4px); }
  .slide-enter-active, .slide-leave-active { transition: all .2s ease; }
  .slide-enter-from, .slide-leave-to { opacity: 0; max-height: 0; }
  .slide-enter-to, .slide-leave-from { opacity: 1; max-height: 500px; }

  @media (max-width: 640px) {
    .card { padding: 1.25rem; }
    .settings-grid { grid-template-columns: 1fr; }
    .results-header, .result-row {
      grid-template-columns: 1.5rem 1fr 1fr 2rem;
      padding: .4rem .5rem;
    }
    .results-header span:nth-child(4),
    .result-row .strength-badge { display: none; }
    .credential-input { font-size: .7rem; }
  }
</style>
</head>
<body>

<div id="app">
  <div class="card">
    <h1 class="title">
      <span class="title-icon">🔐</span>
      Roblox Alt Generator
    </h1>
    <p class="subtitle">Cryptographically secure credentials — nothing leaves your browser</p>

    <button class="settings-toggle" @click="showSettings = !showSettings">
      ⚙️ {{ showSettings ? 'Hide' : 'Show' }} Settings
      <span :class="['chevron', { rotated: showSettings }]">▼</span>
    </button>

    <transition name="slide">
      <div v-if="showSettings" class="settings-panel">
        <div class="settings-grid">
          <div class="setting-item">
            <label>Accounts</label>
            <select v-model.number="batchSize" class="select">
              <option v-for="n in [1,3,5,10,25,50]" :key="n" :value="n">{{ n }}</option>
            </select>
          </div>
          <div class="setting-item">
            <label>Password Length</label>
            <select v-model.number="passwordLength" class="select">
              <option v-for="n in [12,16,20,24,32]" :key="n" :value="n">{{ n }}</option>
            </select>
          </div>
          <div class="setting-item">
            <label>Username Style</label>
            <select v-model="usernameStyle" class="select">
              <option value="mixed">Mixed</option>
              <option value="word">Word Combo</option>
              <option value="leet">Leet Speak</option>
              <option value="random">Random Alnum</option>
            </select>
          </div>
          <div class="setting-item toggle">
            <label>
              <input type="checkbox" v-model="includeSymbols" class="toggle-input" />
              Include Symbols
            </label>
          </div>
        </div>
      </div>
    </transition>

    <button class="generate-btn" @click="generateAccounts" :disabled="isGenerating">
      <span v-if="isGenerating" class="spinner"></span>
      <span v-else>✨</span>
      {{ isGenerating ? 'Generating…' : 'Generate' }}
    </button>

    <transition-group name="fade" tag="div">
      <div v-if="accounts.length" key="results" class="results-wrapper">
        <div class="results-actions">
          <button class="action-btn" @click="copyAll">📋 Copy All</button>
          <button class="action-btn" @click="exportTXT">⬇️ Export TXT</button>
          <button class="action-btn danger" @click="clearAccounts">🗑️ Clear</button>
        </div>
        <div class="results">
          <div class="results-header">
            <span>#</span>
            <span>Username</span>
            <span>Password</span>
            <span>Strength</span>
            <span></span>
          </div>
          <div v-for="(account, i) in accounts" :key="i" class="result-row">
            <span class="index">{{ i + 1 }}</span>
            <input
              :value="account.username"
              readonly
              class="credential-input"
              @focus="$event.target.select()"
            />
            <input
              :value="account.password"
              readonly
              class="credential-input mono"
              @focus="$event.target.select()"
            />
            <span :class="['strength-badge', account.strengthClass]">
              {{ account.strengthLabel }}
            </span>
            <button class="copy-btn" @click="copyAccount(account)" title="Copy">📋</button>
          </div>
        </div>
      </div>
    </transition-group>

    <transition-group name="fade">
      <div v-if="status === 'success'" key="success" class="alert success">
        ✓ <div><strong>Success!</strong> {{ successMessage }}</div>
        <button class="close-btn" @click="resetStatus">✕</button>
      </div>
      <div v-if="status === 'error'" key="error" class="alert error">
        ⚠️ <div><strong>Error:</strong> {{ errorMessage }}</div>
        <button class="close-btn" @click="resetStatus">✕</button>
      </div>
    </transition-group>

    <footer class="footer">
      <p class="security-note">🔒 All generation runs locally — zero network calls.</p>
      <a
        class="signup-link"
        href="https://www.roblox.com/account/signup"
        target="_blank"
        rel="noopener noreferrer"
      >
        ↗ Open Roblox Signup
      </a>
    </footer>
  </div>
</div>

<script>
const { createApp, ref } = Vue;

/* ========== CSPRNG UTILITIES ========== */
function randomInt(max) {
  if (max <= 0) return 0;
  const limit = Math.floor(0xffffffff / max) * max;
  const buf = new Uint32Array(1);
  let v;
  do { crypto.getRandomValues(buf); v = buf[0]; } while (v >= limit);
  return v % max;
}
function randomFloat() {
  const buf = new Uint32Array(1);
  crypto.getRandomValues(buf);
  return buf[0] / 0x100000000;
}
const randomItem = (arr) => arr[randomInt(arr.length)];
const randomIntRange = (min, max) => min + randomInt(max - min + 1);
function shuffle(arr) {
  const r = [...arr];
  for (let i = r.length - 1; i > 0; i--) {
    const j = randomInt(i + 1);
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}

/* ========== WORD LISTS ========== */
const adjectives = [
  'Epic','Frost','Shadow','Cosmic','Neon','Silent','Rapid','Alpha','Crimson',
  'Golden','Lunar','Solar','Crystal','Wild','Royal','Zero','Hyper','Turbo',
  'Quantum','Ghost','Blazing','Frozen','Mystic','Iron','Velvet','Thunder',
  'Echo','Prism','Nova','Onyx','Cobalt','Rogue','Swift','Titan','Hollow',
  'Savage','Digital','Atomic','Chrome','Vivid',
];
const nouns = [
  'Ninja','Pilot','Wolf','Dragon','Falcon','Rider','Knight','Hunter','Wizard',
  'Fox','Storm','Blade','Vortex','Phantom','Reaper','Sniper','Tiger','Raven',
  'Cipher','Golem','Oracle','Sentinel','Raptor','Kraken','Cobra','Hydra',
  'Comet','Beacon','Circuit','Panther','Viper','Gambit','Havoc','Echo',
  'Orbit','Pulse','Riot','Saber','Zenith',
];
const suffixes = [
  '','','','x','z','xx','69','42','777','01','99','v2','pro','max','HQ','gg',
  'ace','one','001','007',
];

/* ========== LEET ========== */
const leetMap = {
  a:['4','@'], e:['3'], i:['1','!'], o:['0'], s:['5','$'],
  t:['7'], l:['1'], g:['9'], b:['8'],
};
function applyLeet(str, p = 0.3) {
  return [...str].map(c => {
    const l = c.toLowerCase();
    if (leetMap[l] && randomFloat() < p) return randomItem(leetMap[l]);
    return c;
  }).join('');
}

/* ========== USERNAME GEN ========== */
function genWordUser() {
  let u = randomItem(adjectives) + randomItem(nouns);
  if (randomFloat() < 0.45) u += randomItem(suffixes);
  const r = randomFloat();
  if (r < 0.2) u = u.toUpperCase();
  else if (r < 0.4) u = u.toLowerCase();
  else if (r < 0.6) u = [...u].map(c => randomFloat() < 0.5 ? c.toUpperCase() : c.toLowerCase()).join('');
  if (randomFloat() < 0.4) u = applyLeet(u, 0.25);
  if (randomFloat() < 0.3 && u.length < 16) u += randomIntRange(1, 99);
  return u;
}
function genLeetUser() {
  let u = randomItem(adjectives) + randomItem(nouns);
  if (randomFloat() < 0.5) u += randomItem(suffixes);
  u = applyLeet(u, 0.55);
  if (randomFloat() < 0.5 && u.length < 16) u += randomIntRange(10, 999);
  return u;
}
function genRandomUser() {
  const letters = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const alnum = letters + '0123456789';
  const len = randomIntRange(8, 16);
  let u = letters[randomInt(letters.length)];
  for (let i = 1; i < len; i++) u += alnum[randomInt(alnum.length)];
  return u;
}
function isValidUsername(u) {
  return u.length >= 3 && u.length <= 20
    && /^[A-Za-z0-9_]+$/.test(u)
    && !u.startsWith('_') && !u.endsWith('_')
    && (u.match(/_/g) || []).length <= 1;
}
function genValidUsername(style, taken) {
  for (let i = 0; i < 60; i++) {
    const s = style === 'mixed' ? randomItem(['word','leet','random']) : style;
    const u = s === 'word' ? genWordUser() : s === 'leet' ? genLeetUser() : genRandomUser();
    if (isValidUsername(u) && !taken.has(u)) return u;
  }
  return 'Alt' + crypto.getRandomValues(new Uint32Array(1))[0].toString(36).slice(0, 20);
}

/* ========== PASSWORD GEN ========== */
const LOWER = 'abcdefghijkmnopqrstuvwxyz';
const UPPER = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
const DIGITS = '23456789';
const SYMBOLS = '!@#$%^&*()-_=+[]{};:,.?';
function genPassword(len, withSymbols) {
  const pools = [LOWER, UPPER, DIGITS];
  if (withSymbols) pools.push(SYMBOLS);
  const all = pools.join('');
  const chars = pools.map(p => p[randomInt(p.length)]);
  while (chars.length < len) chars.push(all[randomInt(all.length)]);
  while (chars.length > len) chars.pop();
  return shuffle(chars).join('');
}

/* ========== STRENGTH ========== */
function calcStrength(password) {
  let cs = 0;
  if (/[a-z]/.test(password)) cs += 26;
  if (/[A-Z]/.test(password)) cs += 26;
  if (/[0-9]/.test(password)) cs += 10;
  if (/[^A-Za-z0-9]/.test(password)) cs += 32;
  const entropy = password.length * Math.log2(cs || 1);
  if (entropy >= 100) return { label: 'Excellent', class: 'excellent' };
  if (entropy >= 80)  return { label: 'Strong',    class: 'strong' };
  if (entropy >= 60)  return { label: 'Good',      class: 'good' };
  if (entropy >= 40)  return { label: 'Fair',      class: 'fair' };
  return { label: 'Weak', class: 'weak' };
}

/* ========== APP ========== */
createApp({
  setup() {
    const accounts = ref([]);
    const batchSize = ref(1);
    const passwordLength = ref(20);
    const usernameStyle = ref('mixed');
    const includeSymbols = ref(true);
    const showSettings = ref(false);

    const isGenerating = ref(false);
    const status = ref('idle');
    const successMessage = ref('');
    const errorMessage = ref('');

    const resetStatus = () => {
      status.value = 'idle';
      successMessage.value = '';
      errorMessage.value = '';
    };

    const generateAccounts = () => {
      isGenerating.value = true;
      status.value = 'idle';
      requestAnimationFrame(() => {
        try {
          const taken = new Set();
          const results = [];
          for (let i = 0; i < batchSize.value; i++) {
            const username = genValidUsername(usernameStyle.value, taken);
            taken.add(username);
            const password = genPassword(passwordLength.value, includeSymbols.value);
            const strength = calcStrength(password);
            results.push({
              username, password,
              strengthLabel: strength.label,
              strengthClass: strength.class,
            });
          }
          accounts.value = results;
          status.value = 'success';
          successMessage.value = `Generated ${results.length} account${results.length > 1 ? 's' : ''} with CSPRNG.`;
        } catch (err) {
          status.value = 'error';
          errorMessage.value = err instanceof Error ? err.message : 'Generation failed.';
        } finally {
          isGenerating.value = false;
        }
      });
    };

    const copyAccount = async (account) => {
      try {
        await navigator.clipboard.writeText(
          `Username: ${account.username}\nPassword: ${account.password}`
        );
        status.value = 'success';
        successMessage.value = 'Account copied to clipboard.';
      } catch {
        status.value = 'error';
        errorMessage.value = 'Clipboard blocked — select and copy manually.';
      }
    };

    const copyAll = async () => {
      try {
        const text = accounts.value
          .map(a => `Username: ${a.username}\nPassword: ${a.password}`)
          .join('\n\n');
        await navigator.clipboard.writeText(text);
        status.value = 'success';
        successMessage.value = `Copied all ${accounts.value.length} accounts.`;
      } catch {
        status.value = 'error';
        errorMessage.value = 'Clipboard blocked.';
      }
    };

    const exportTXT = () => {
      const text = accounts.value
        .map(a => `Username: ${a.username}\nPassword: ${a.password}`)
        .join('\n\n');
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `roblox-alts-${Date.now()}.txt`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      status.value = 'success';
      successMessage.value = 'TXT exported.';
    };

    const clearAccounts = () => {
      accounts.value = [];
      resetStatus();
    };

    return {
      accounts, batchSize, passwordLength, usernameStyle, includeSymbols,
      showSettings, isGenerating, status, successMessage, errorMessage,
      generateAccounts, copyAccount, copyAll, exportTXT, clearAccounts, resetStatus,
    };
  }
}).mount('#app');
</script>
</body>
           </html>
